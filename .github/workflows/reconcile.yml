name: Reconcile GitHub Copilot AI Credits

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: UTC date to reconcile (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine date
        id: day
        shell: bash
        run: |
          if [ -n '${{ inputs.date }}' ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_BILLING_TOKEN }}
        run: |
          python3 -m copilot_cost.cli.main reconcile \
            --org "${GITHUB_REPOSITORY_OWNER}" \
            --from "${{ steps.day.outputs.date }}" \
            --to "${{ steps.day.outputs.date }}" \
            --repo-file config/repos.txt \
            --user-file config/users.txt \
            --project-map config/repo-projects.json
